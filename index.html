<title>ProfitCalc — Malaysia Sellers</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#A21CAF">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root {
  --accent:        #DB2777;
  --accent-dim:    #BE185D;
  --accent-2:      #7C3AED;
  --accent-bg:     #FDF2F8;
  --accent-border: #FBCFE8;
  --grad:          linear-gradient(135deg,#F43F5E,#D946EF 55%,#8B5CF6);
  --grad-deep:     linear-gradient(205deg,#4338CA -15%,#7E22CE 50%,#BE185D 115%);
  --wash:          linear-gradient(160deg,#F5F3FF,#FDF2F8 45%,#FFF6F1);
  --bg:            #F7F5FA;
  --surface:       #FFFFFF;
  --border:        #E9E4F0;
  --border-light:  #F3F0F7;
  --text:          #191326;
  --text-2:        #3D3450;
  --text-3:        #6E6584;
  --text-4:        #A29AB5;
  --green:         #059669;
  --green-bg:      #ECFDF5;
  --green-border:  #A7F3D0;
  --orange:        #D97706;
  --orange-bg:     #FFFBEB;
  --orange-border: #FDE68A;
  --red:           #EF4444;
  --sidebar-bg:    var(--grad-deep);
  --sidebar-w:     210px;
  --radius:        14px;
  --radius-sm:     9px;
  --shadow:        0 1px 2px rgba(46,16,101,.05),0 4px 16px rgba(46,16,101,.07);
  --shadow-md:     0 8px 28px rgba(46,16,101,.16);
  --glow:          0 4px 18px rgba(217,70,239,.35);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:           #131020;
    --surface:      #1B1730;
    --border:       #2E2749;
    --border-light: #241E3C;
    --text:         #F2EFFA;
    --text-2:       #CFC8E4;
    --text-3:       #9C93B8;
    --text-4:       #6C6488;
    --green:        #34D399;
    --green-bg:     #06422F;
    --green-border: #065F46;
    --orange:       #FBBF24;
    --orange-bg:    #3B2405;
    --orange-border:#92400E;
    --red:          #F87171;
    --accent:       #F472B6;
    --accent-dim:   #EC4899;
    --accent-2:     #A78BFA;
    --accent-bg:    #2A1233;
    --accent-border:#6B2160;
    --grad:         linear-gradient(135deg,#FB7185,#E879F9 55%,#A78BFA);
    --grad-deep:    linear-gradient(205deg,#312E81 -15%,#6B21A8 50%,#9D174D 115%);
    --wash:         linear-gradient(160deg,#0E0B1A,#170F26 50%,#1B1024);
    --shadow:       0 1px 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
    --shadow-md:    0 10px 32px rgba(0,0,0,.5);
    --glow:         0 4px 18px rgba(217,70,239,.25);
  }
}
:root[data-theme="dark"] {
  --bg:#131020; --surface:#1B1730; --border:#2E2749; --border-light:#241E3C;
  --text:#F2EFFA; --text-2:#CFC8E4; --text-3:#9C93B8; --text-4:#6C6488;
  --green:#34D399; --green-bg:#06422F; --green-border:#065F46;
  --orange:#FBBF24; --orange-bg:#3B2405; --orange-border:#92400E;
  --red:#F87171;
  --accent:#F472B6; --accent-dim:#EC4899; --accent-2:#A78BFA;
  --accent-bg:#2A1233; --accent-border:#6B2160;
  --grad:linear-gradient(135deg,#FB7185,#E879F9 55%,#A78BFA);
  --grad-deep:linear-gradient(205deg,#312E81 -15%,#6B21A8 50%,#9D174D 115%);
  --wash:linear-gradient(160deg,#0E0B1A,#170F26 50%,#1B1024);
  --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  --shadow-md:0 10px 32px rgba(0,0,0,.5);
  --glow:0 4px 18px rgba(217,70,239,.25);
}
:root[data-theme="light"] {
  --bg:#F7F5FA; --surface:#FFFFFF; --border:#E9E4F0; --border-light:#F3F0F7;
  --text:#191326; --text-2:#3D3450; --text-3:#6E6584; --text-4:#A29AB5;
  --green:#059669; --green-bg:#ECFDF5; --green-border:#A7F3D0;
  --orange:#D97706; --orange-bg:#FFFBEB; --orange-border:#FDE68A;
  --red:#EF4444;
  --accent:#DB2777; --accent-dim:#BE185D; --accent-2:#7C3AED;
  --accent-bg:#FDF2F8; --accent-border:#FBCFE8;
  --grad:linear-gradient(135deg,#F43F5E,#D946EF 55%,#8B5CF6);
  --grad-deep:linear-gradient(205deg,#4338CA -15%,#7E22CE 50%,#BE185D 115%);
  --wash:linear-gradient(160deg,#F5F3FF,#FDF2F8 45%,#FFF6F1);
  --shadow:0 1px 2px rgba(46,16,101,.05),0 4px 16px rgba(46,16,101,.07);
  --shadow-md:0 8px 28px rgba(46,16,101,.16);
  --glow:0 4px 18px rgba(217,70,239,.35);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
html,body{height:100%;font-family:system-ui,-apple-system,sans-serif;color:var(--text);font-size:14px;line-height:1.5}
body{background:var(--wash) fixed}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ─── LAYOUT ─── */
.shell{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:50;overflow-y:auto}
.main{margin-left:var(--sidebar-w);flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:52px;background:color-mix(in srgb,var(--surface) 78%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:40}
.content{padding:18px 20px 40px;max-width:900px}

/* ─── SIDEBAR ─── */
.sb-logo{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:10px}
.sb-logo-icon{width:32px;height:32px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-logo-icon svg{width:16px;height:16px}
.sb-logo-text{font-size:13px;font-weight:700;color:#fff;line-height:1.2}
.sb-logo-sub{font-size:10px;color:rgba(255,255,255,.55);margin-top:1px}
.sb-nav{padding:10px 8px;flex:1}
.sb-section{font-size:9px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:.1em;text-transform:uppercase;padding:10px 8px 4px}
.sb-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;color:rgba(255,255,255,.65);font-size:12px;font-weight:500;transition:all .14s;border:none;background:none;width:100%;text-align:left}
.sb-item:hover{background:rgba(255,255,255,.1);color:#fff}
.sb-item.active{background:rgba(255,255,255,.18);color:#fff;font-weight:600}
.sb-item .icon{font-size:13px;width:16px;text-align:center;flex-shrink:0}
.sb-soon{font-size:8px;margin-left:auto;background:rgba(255,255,255,.14);padding:1px 5px;border-radius:3px;color:rgba(255,255,255,.6)}
.sb-footer{padding:12px 14px;border-top:1px solid rgba(255,255,255,.1);font-size:10px;color:rgba(255,255,255,.4);line-height:1.7}
.sb-footer strong{color:rgba(255,255,255,.65)}

/* ─── TOPBAR ─── */
.page-label{font-size:14px;font-weight:700;color:var(--text)}
.topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.theme-btn{width:32px;height:32px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text-3);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .14s}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}
.avatar{width:32px;height:32px;border-radius:9px;background:var(--grad);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--glow)}

/* ─── CARDS ─── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.card-icon{width:26px;height:26px;background:var(--accent-bg);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;color:var(--accent)}
.card-sub{font-size:11px;color:var(--text-3);margin-top:2px}

/* ─── STATS GRID ─── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat-label{font-size:10px;color:var(--text-4);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.stat-val{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.stat-val.red{background:none;color:var(--accent)} .stat-val.green{background:none;color:var(--green)}
.stat-note{font-size:11px;color:var(--text-4);margin-top:4px}

/* ─── FORM ─── */
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:11px;font-weight:600;color:var(--text-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
input[type=text],input[type=number],select{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;font-family:inherit;padding:8px 11px;outline:none;transition:border-color .14s,box-shadow .14s;width:100%}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
input::placeholder{color:var(--text-4)}
input.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace}

/* ─── COST ROWS ─── */
.cost-row{display:grid;grid-template-columns:1fr 38px 110px 30px;gap:7px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border-light)}
.cost-row:last-child{border-bottom:none}
.cost-pfx{font-size:11px;color:var(--text-4);font-weight:600;text-align:center}
.del-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text-4);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .14s}
.del-btn:hover{border-color:var(--red);color:var(--red);background:var(--accent-bg)}

/* ─── TOTAL BAR ─── */
.total-bar{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:var(--accent-bg);border:1px solid var(--accent-border);border-radius:var(--radius-sm);margin-top:10px}
.total-bar-label{font-size:12px;font-weight:600;color:var(--text-2)}
.total-bar-val{font-variant-numeric:tabular-nums;font-size:16px;font-weight:800;color:var(--accent);font-family:ui-monospace,monospace}
.total-bar.orange{background:var(--orange-bg);border-color:var(--orange-border)}
.total-bar.orange .total-bar-val{color:var(--orange)}

/* ─── PLATFORM ─── */
.platform-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.platform-card{border:2px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .14s;background:var(--bg)}
.platform-card:hover{border-color:var(--text-4);background:var(--surface)}
.platform-card.selected{border-color:var(--accent);background:var(--accent-bg)}
.platform-name{font-size:13px;font-weight:700;color:var(--text);margin:8px 0 2px}
.platform-fee{font-size:11px;color:var(--text-3)}

/* ─── TOGGLES ─── */
.toggle-row{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--bg);border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:5px;transition:all .14s}
.toggle-row.on{border-color:var(--accent-border);background:var(--accent-bg)}
.toggle-label{font-size:12px;color:var(--text-2);font-weight:500;flex:1}
.tog{width:34px;height:19px;background:var(--border);border-radius:10px;position:relative;cursor:pointer;transition:background .18s;flex-shrink:0;border:none}
.tog.on{background:var(--grad)}
.tog::after{content:'';position:absolute;width:13px;height:13px;background:#fff;border-radius:50%;top:3px;left:3px;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog.on::after{transform:translateX(15px)}
.mkt-inputs{display:flex;gap:5px;align-items:center}
.seg{display:flex;background:var(--surface);border-radius:5px;border:1px solid var(--border);overflow:hidden}
.seg button{padding:4px 8px;font-size:10px;font-weight:600;color:var(--text-3);background:none;border:none;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--grad);color:#fff}
.mkt-preview{font-size:11px;color:var(--text-3);width:58px;text-align:right;font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace;font-weight:600}

/* ─── PRICE PILLS ─── */
.price-pills{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.pill{border-radius:var(--radius);padding:13px;text-align:center}
.pill.breakeven{background:var(--accent-bg);border:1px solid var(--accent-border)}
.pill.recommend{background:var(--grad);border:none;box-shadow:var(--glow)}
.pill.recommend .pill-label{color:rgba(255,255,255,.8)}
.pill.premium{background:var(--green-bg);border:1px solid var(--green-border)}
.pill-label{font-size:9px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em}
.pill-val{font-variant-numeric:tabular-nums;font-size:17px;font-weight:800;margin-top:3px;font-family:ui-monospace,monospace}
.pill.breakeven .pill-val{color:var(--red)}
.pill.recommend .pill-val{color:#fff}
.pill.premium .pill-val{color:var(--green)}

/* ─── RESULTS ─── */
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.result-item{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;transition:all .14s}
.result-item:hover{border-color:var(--accent-border);background:var(--accent-bg)}
.result-label{font-size:10px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.result-val{font-variant-numeric:tabular-nums;font-size:19px;font-weight:800;font-family:ui-monospace,monospace;color:var(--text)}
.result-val.green{color:var(--green)} .result-val.red{color:var(--red)} .result-val.primary{color:var(--accent)} .result-val.orange{color:var(--orange)}

/* ─── FEE BREAKDOWN ─── */
.fee-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px}
.fee-box-title{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px}
.fee-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0}
.fee-key{font-size:11px;color:var(--text-3)}
.fee-val{font-size:11px;font-family:ui-monospace,monospace;color:var(--text-2);font-weight:600;font-variant-numeric:tabular-nums}
.fee-total-row{display:flex;justify-content:space-between;padding-top:7px;margin-top:5px;border-top:1px solid var(--border)}
.fee-total-key{font-size:12px;font-weight:700;color:var(--text)}
.fee-total-val{font-size:13px;font-weight:800;font-family:ui-monospace,monospace;color:var(--accent);font-variant-numeric:tabular-nums}

/* ─── SLIDER ─── */
.sim-display{text-align:center;padding:20px;background:var(--grad);border:none;border-radius:var(--radius);margin-bottom:16px;box-shadow:var(--glow)}
.sim-price{font-variant-numeric:tabular-nums;font-size:38px;font-weight:800;color:#fff;font-family:ui-monospace,monospace;text-shadow:0 2px 8px rgba(0,0,0,.15)}
.sim-note{font-size:11px;color:rgba(255,255,255,.8);margin-top:3px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
input[type=range]{-webkit-appearance:none;width:100%;height:5px;border-radius:3px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 2px 6px color-mix(in srgb,var(--accent) 30%,transparent);cursor:pointer}
.slider-labels{display:flex;justify-content:space-between;margin-top:7px}
.slider-label{font-size:10px;color:var(--text-4);font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ─── SCENARIOS ─── */
.scenario-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scenario-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;transition:all .14s}
.scenario-card:hover{border-color:var(--accent-border)}
.scenario-eyebrow{font-size:9px;color:var(--accent);font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.scenario-name{font-size:12px;color:var(--text);font-weight:700;margin-bottom:8px}
.sc-row{display:flex;justify-content:space-between;align-items:center;padding:2px 0}
.sc-key{font-size:11px;color:var(--text-3)}
.sc-val{font-size:11px;font-weight:700;font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums}
.sc-val.g{color:var(--green)} .sc-val.r{color:var(--red)}

/* ─── BTNS ─── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;transition:all .14s;border:none;font-family:inherit}
.btn-primary{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.btn-primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-outline{background:var(--surface);color:var(--text-2);border:1px solid var(--border)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:var(--accent-bg);color:var(--red);border:1px solid var(--accent-border)}
.btn-danger:hover{background:var(--accent-bg)}
.btn-sm{padding:5px 11px;font-size:11px}

/* ─── AI BOX ─── */
.ai-box{background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad) border-box;border:1.5px solid transparent;border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.ai-head{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.ai-dot{width:6px;height:6px;background:var(--accent);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.ai-badge{font-size:10px;font-weight:800;letter-spacing:.08em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ai-rating{font-size:11px;font-weight:800;padding:2px 9px;background:var(--surface);border-radius:20px;border:1px solid var(--border);margin-left:auto}
.ai-summary{font-size:13px;color:var(--text);font-weight:600;margin-bottom:9px}
.ai-tip{display:flex;gap:7px;font-size:11px;color:var(--text-2);padding:6px 9px;background:var(--surface);border-radius:6px;border:1px solid var(--accent-border);border-left:3px solid var(--accent);margin-bottom:5px}
.ai-rec{display:flex;align-items:center;gap:10px;margin-top:11px;padding-top:11px;border-top:1px solid var(--accent-border)}
.ai-rec-label{font-size:11px;color:var(--text-3);font-weight:600}
.ai-rec-price{font-variant-numeric:tabular-nums;font-size:17px;font-weight:800;color:var(--accent);font-family:ui-monospace,monospace}

/* ─── SPINNER ─── */
.spinner{width:13px;height:13px;border:2px solid var(--accent-border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── TABLE ─── */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10px;font-weight:700;color:var(--text-3);text-align:left;padding:9px 12px;background:var(--bg);border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.04em}
.tbl td{font-size:12px;color:var(--text-2);padding:11px 12px;border-bottom:1px solid var(--border-light)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--accent-bg)}

/* ─── BADGE ─── */
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.badge-shopee{background:#FFF0EE;color:#EE4D2D}
.badge-tiktok{background:var(--border-light);color:var(--text)}

/* ─── SEARCH ─── */
.search-wrap{position:relative}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-4);font-size:12px}
.search-input{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:12px;font-family:inherit;padding:7px 11px 7px 28px;outline:none;width:200px}

/* ─── TABS ─── */
.tabs{display:flex;gap:2px;background:var(--border-light);border-radius:8px;padding:3px;margin-bottom:14px}
.tab-btn{flex:1;padding:6px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;color:var(--text-3);background:none;border:none;font-family:inherit;transition:all .14s}
.tab-btn.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* ─── ADMIN INPUT ─── */
.admin-input{background:var(--surface);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:11px;font-family:ui-monospace,monospace;padding:4px 7px;outline:none;width:66px;text-align:right;font-variant-numeric:tabular-nums}

/* ─── ALERT ─── */
.alert{display:flex;align-items:flex-start;gap:9px;padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:14px;font-size:12px}
.alert.warn{background:var(--orange-bg);border:1px solid var(--orange-border);color:var(--orange)}

/* ─── QUICK CARDS ─── */
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.quick-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:all .18s;box-shadow:var(--shadow)}
.quick-card:hover{border-color:var(--accent);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.quick-icon{font-size:28px;margin-bottom:10px}
.quick-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px}
.quick-sub{font-size:11px;color:var(--text-3);line-height:1.5}

/* ─── EMPTY ─── */
.empty{text-align:center;padding:44px 20px}
.empty-icon{font-size:44px;margin-bottom:12px}
.empty-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:5px}
.empty-sub{font-size:12px;color:var(--text-3)}

/* ─── MONITOR ─── */
.monitor-item{display:flex;gap:11px;align-items:flex-start;padding:12px;background:var(--bg);border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:7px;transition:all .14s}

.mon-dot.ok{background:var(--green)} .mon-dot.chg{background:var(--orange);animation:pulse 2s infinite}
.mon-source{font-size:12px;color:var(--text);font-weight:600}
.mon-detail{font-size:11px;color:var(--text-4);margin-top:1px}
.mon-change{font-size:11px;color:var(--orange);margin-top:3px;font-weight:600}
.conf-bar{display:flex;align-items:center;gap:7px;margin-top:5px}
.conf-track{height:4px;background:var(--border);border-radius:2px;flex:1;overflow:hidden}
.conf-fill{height:100%;border-radius:2px;background:var(--grad)}

<script>
// ─── FEE DATABASE ───────────────────────────────────────────
// Kadar berkuat kuasa Feb 2026, termasuk 8% SST.
// c   = Komisyen marketplace
// t   = Fee transaksi/pembayaran (standard, bukan SPayLater)
// p   = Fee program (Shopee: Free Shipping/CCB ~5.94% · TikTok: Bonus Cashback ~4.86%)
// flat= Platform Support Fee tetap setiap pesanan (RM0.54 termasuk SST)
// Komisyen sebenar berbeza ikut sub-kategori — sahkan di Seller Centre.
const FEE_DB = {
  shopee:{name:"Shopee Malaysia",categories:{
    "Fashion":          {c:10.26,t:3.78,p:5.94,flat:0.54},
    "Electronics":      {c:10.26,t:3.78,p:5.94,flat:0.54},
    "Health & Beauty":  {c:10.26,t:3.78,p:5.94,flat:0.54},
    "Home & Living":    {c:10.26,t:3.78,p:5.94,flat:0.54},
    "Food & Beverages": {c:10.26,t:3.78,p:5.94,flat:0.54},
  }},
  tiktok:{name:"TikTok Shop Malaysia",categories:{
    "Fashion":          {c:8.37, t:3.78,p:4.86,flat:0.54},
    "Electronics":      {c:7.02, t:3.78,p:4.86,flat:0.54},
    "Health & Beauty":  {c:8.37, t:3.78,p:4.86,flat:0.54},
    "Home & Living":    {c:8.37, t:3.78,p:4.86,flat:0.54},
    "Food & Beverages": {c:10.26,t:3.78,p:4.86,flat:0.54},
  }}
};
const CATS = Object.keys(FEE_DB.shopee.categories);

// ─── HELPERS ────────────────────────────────────────────────
const rm = v => `RM${(+v||0).toFixed(2)}`;
const pct = v => `${(+v||0).toFixed(1)}%`;
const profitColor = v => +v >= 0 ? 'green' : 'red';
const marginColor = v => +v >= 15 ? 'green' : +v >= 5 ? 'orange' : 'red';
const roiColor = v => +v >= 20 ? 'green' : +v >= 0 ? 'orange' : 'red';

// ─── COMPUTATION ────────────────────────────────────────────
function feeRule(state) {
  const db = state.feeDb || FEE_DB;
  return (db[state.platform]?.categories?.[state.category]) || {c:10.26,t:3.78,p:5.94,flat:0.54};
}
function calcFees(price, rule) {
  const c=price*(rule.c/100), t=price*(rule.t/100), pl=price*(rule.p/100), flat=+rule.flat||0;
  return {c,t,pl,flat,total:c+t+pl+flat};
}
function calcMkt(price, mkt) {
  let total=0;
  Object.values(mkt).forEach(item => {
    if(!item.on) return;
    total += item.type==='pct' ? price*(item.v/100) : item.v;
  });
  return total;
}
function compute(state) {
  const rule = feeRule(state);
  const price = state.price;
  const productCost = state.costs.reduce((s,c)=>s+(+c.amount||0),0);
  const fees = calcFees(price, rule);
  const mktTotal = calcMkt(price, state.mkt);
  const totalCost = productCost + fees.total + mktTotal;
  const netProfit = price - totalCost;
  const margin = price > 0 ? (netProfit/price)*100 : 0;
  const roi = productCost > 0 ? (netProfit/productCost)*100 : 0;
  return { rule, productCost, fees, mktTotal, totalCost, netProfit, margin, roi,
    sellerPayout: price - fees.total,
    breakEven: totalCost,
    recommended: totalCost * 1.20,
    premium: totalCost * 1.35,
  };
}
function computeScenario(state, mktOverride) {
  const s2 = {...state, mkt: mktOverride};
  return compute(s2);
}

function viewCalculator() {
  const C = compute(S);
  const rule = C.rule;
  const minS = Math.max(C.productCost*0.8,1);

  const sliderPct = Math.min(100,Math.max(0,((S.price-minS)/(maxS-minS))*100));
  const mktMajKeys = Object.keys(S.mkt);

  const scenarios = [

// ─── REVERSE PRICING ────────────────────────────────────────
function reverseCalc(cost, marginPct, adsPct, rule) {
  const flat = +rule.flat||0;
  const denom = 1 - (rule.c+rule.t+rule.p)/100 - adsPct/100 - marginPct/100;
  if (denom <= 0.01) return {ok:false};
  const price = (cost + flat) / denom;
  const fees = price*(rule.c+rule.t+rule.p)/100 + flat;
  const ads = price*adsPct/100;
  const profit = price - fees - ads - cost;
  return {ok:true, price, fees, ads, profit, margin:price?profit/price*100:0, payout:price-fees};
}

  const db = S.feeDb||FEE_DB;

}

// ─── AUDIT PUKAL (CSV) ──────────────────────────────────────
function parseCSV(text) {
  const lines = text.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  return lines.map(l=>{
    const out=[]; let cur='', q=false;
    for (const ch of l) {
      if (ch==='"') { q=!q; continue; }
      if ((ch===','||ch===';') && !q) { out.push(cur); cur=''; continue; }
      cur+=ch;
    }
    out.push(cur);
    return out.map(s=>s.trim());
  });
}

function loadAuditCSV(text, name) {
  const rows = parseCSV(text);
  if (!rows.length) { alert('Fail CSV kosong.'); return; }
  let start=0, map={nama:0,kos:1,harga:2,platform:3,kategori:4,iklan:5};
  const h = rows[0].map(x=>x.toLowerCase());
  if (h.some(x=>/nama|name|produk|product|kos|cost|modal|harga|price/.test(x))) {
    start=1;
    const idx=(...keys)=>h.findIndex(x=>keys.some(k=>x.includes(k)));
    map={nama:idx('nama','name','produk','product'),kos:idx('kos','cost','modal'),harga:idx('harga','price'),
         platform:idx('platform'),kategori:idx('kategori','category'),iklan:idx('iklan','ads','marketing')};
  }
  const data = rows.slice(start);
  S.audit.truncated = data.length>100;
  S.audit.fileName = name;
  S.audit.rows = data.slice(0,100).map((r,i)=>{
    const g=k=>map[k]>=0?(r[map[k]]||''):'';
    const num=v=>parseFloat(String(v).replace(/[^0-9.\-]/g,''))||0;
    const platform=(g('platform')||'shopee').toLowerCase().includes('tik')?'tiktok':'shopee';
    const cats=Object.keys(FEE_DB[platform].categories);
    const raw=g('kategori').toLowerCase().trim();
    const category=cats.find(c=>c.toLowerCase()===raw)||cats.find(c=>raw&&c.toLowerCase().includes(raw))||'Health & Beauty';
    return {name:g('nama')||('Produk '+(i+1)), cost:num(g('kos')), price:num(g('harga')), platform, category, ads:num(g('iklan'))};
  });
  render();
}

function auditCalc(p) {
  const db = S.feeDb||FEE_DB;
  const rule = db[p.platform]?.categories?.[p.category] || {c:10.26,t:3.78,p:5.94,flat:0.54};
  const fees = p.price*(rule.c+rule.t+rule.p)/100 + (+rule.flat||0);
  const ads = p.price*p.ads/100;
  const profit = p.price - fees - ads - p.cost;
  const margin = p.price ? profit/p.price*100 : 0;
  const sug = reverseCalc(p.cost, S.audit.target, p.ads, rule);
  const status = profit<0 ? 'rugi' : (margin<10 ? 'bahaya' : 'sihat');
  return {fees, ads, profit, margin, sug, status, rule};
}

function e(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

window.runAI = async () => {
  S.aiLoading = true; render();
  await new Promise(r=>setTimeout(r,1200));
  const C = compute(S);
  const m = C.margin;
  let rating = m>25?'Excellent':m>15?'Good':m>5?'Fair':m>0?'Poor':'Rugi';
  let tips = [];
  if(m<15) tips.push(`Margin ${pct(m)} di bawah 15% — pertimbangkan naikkan harga atau kurangkan kos pembungkusan.`);
  if(S.mkt.affiliate.on && S.mkt.affiliate.v>10) tips.push(`Komisyen affiliate ${S.mkt.affiliate.v}% agak tinggi — cuba kurangkan ke 8-10%.`);
  if(C.fees.total > S.price*0.1) tips.push('Fee marketplace melebihi 10% harga jual — pertimbangkan kategori atau platform yang lebih rendah fee.');
  if(!tips.length) tips.push(`Margin ${pct(m)} — dalam julat yang baik untuk marketplace Malaysia.`);
  tips.push('Bandingkan harga pesaing di platform yang sama sebelum tetapkan harga akhir.');
  if(tips.length<3) tips.push('Aktifkan GMV Max semasa kempen untuk tingkatkan visibility tanpa kos tetap.');
  S.aiAdvice = {
    summary: m>15 ? `Produk ini mempunyai margin ${pct(m)} — keuntungan yang sihat untuk ${S.platform==='shopee'?'Shopee':'TikTok Shop'} MY.` : `Margin ${pct(m)} agak rendah — ada ruang penambahbaikan sebelum listing.`,
    rating, tips: tips.slice(0,3),
    rec: C.recommended,
    warning: m<=0 ? 'RUGI — harga jual lebih rendah daripada jumlah kos. Naikkan harga segera.' : null
  };
  S.aiLoading = false;
  render();
};

function live() {
  if(S.view !== 'calculator') return;
  const C = compute(S);

    netProfit: rm(C.netProfit), margin: pct(C.margin), roi: pct(C.roi),

  };

  };
  document.querySelectorAll('[data-k]').forEach(el => {
    const k = el.dataset.k;

}

// ─── KOD AKSES (LESEN) ──────────────────────────────────────
// SHA-256 tulen JS (untuk gate kod akses — sync, tiada dependency)
function sha256hex(str) {
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const bytes = [];
  for (let i=0;i<str.length;i++){
    let c=str.charCodeAt(i);
    if(c<128)bytes.push(c);
    else if(c<2048){bytes.push(192|c>>6,128|c&63);}
    else if(c<0xd800||c>=0xe000){bytes.push(224|c>>12,128|c>>6&63,128|c&63);}
    else{c=0x10000+((c&1023)<<10)+(str.charCodeAt(++i)&1023);bytes.push(240|c>>18,128|c>>12&63,128|c>>6&63,128|c&63);}
  }
  const len=bytes.length; bytes.push(0x80);
  while(bytes.length%64!==56)bytes.push(0);
  const hi=Math.floor(len*8/4294967296), lo=(len*8)>>>0;
  bytes.push(hi>>>24&255,hi>>>16&255,hi>>>8&255,hi&255,lo>>>24&255,lo>>>16&255,lo>>>8&255,lo&255);
  const rr=(x,n)=>(x>>>n)|(x<<(32-n));
  const w=new Array(64);
  for(let i=0;i<bytes.length;i+=64){
    for(let t=0;t<16;t++)w[t]=(bytes[i+t*4]<<24)|(bytes[i+t*4+1]<<16)|(bytes[i+t*4+2]<<8)|bytes[i+t*4+3];
    for(let t=16;t<64;t++){
      const s0=rr(w[t-15],7)^rr(w[t-15],18)^(w[t-15]>>>3);
      const s1=rr(w[t-2],17)^rr(w[t-2],19)^(w[t-2]>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0;
    }
    let[a,b,c,d,e2,f,g,h]=H;
    for(let t=0;t<64;t++){
      const S1=rr(e2,6)^rr(e2,11)^rr(e2,25);
      const ch=(e2&f)^(~e2&g);
      const t1=(h+S1+ch+K[t]+w[t])>>>0;
      const S0=rr(a,2)^rr(a,13)^rr(a,22);
      const mj=(a&b)^(a&c)^(b&c);
      const t2=(S0+mj)>>>0;
      h=g;g=f;f=e2;e2=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    H=[(H[0]+a)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e2)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0];
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}
